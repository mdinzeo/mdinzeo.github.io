<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{DESCRIPTION}}">
    <title>{{TITLE}}</title>

    <!-- Styles -->
    <link rel="stylesheet" href="/assets/css/styles.css">

    <!-- Favicon (placeholder for now) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{URL}}">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <nav class="nav">
                    <a href="/" class="nav-item {{HOME_ACTIVE}}">Home</a>
                    <a href="/about/" class="nav-item {{ABOUT_ACTIVE}}">About Me</a>
                    <a href="/contact/" class="nav-item {{CONTACT_ACTIVE}}">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {{CONTENT}}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; {{YEAR}} Maria Dinzeo. All rights reserved.</p>
                <p>
                    <a href="https://www.linkedin.com/in/maria-dinzeo/" target="_blank" rel="noopener" style="color: var(--color-accent); text-decoration: none;">LinkedIn</a>
                    <span style="color: var(--color-text-muted); margin: 0 var(--space-sm);">•</span>
                    <a href="https://x.com/MariaDinzeo" target="_blank" rel="noopener" style="color: var(--color-accent); text-decoration: none;">X</a>
                </p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    {{SCRIPTS}}
</body>
</html>
